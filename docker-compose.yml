
services:
  postgres:
    image: postgres:17
    container_name: moneyflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: moneyflow
      POSTGRES_PASSWORD: moneyflow_dev_2026
      POSTGRES_DB: moneyflow_db
    ports:
      - "5435:5432"
    volumes:
      - moneyflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moneyflow -d moneyflow_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  moneyflow_postgres_data:
